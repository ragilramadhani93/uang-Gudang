name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Tombol manual "Run workflow" di GitHub Actions

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install Dependencies
        run: npm install

      - name: 6. Expo Prebuild (Generate Android Project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 7. Berikan Izin Eksekusi Gradle
        run: chmod +x android/gradlew

      - name: 8. Build APK Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 9. Siapkan File APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/OPS-Gudang-Tracker.apk \;
          ls -la output/

      - name: 10. Upload APK sebagai GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPS-Gudang-Tracker-APK
          path: output/OPS-Gudang-Tracker.apk
          retention-days: 30
